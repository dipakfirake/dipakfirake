name: Daily Contribution

on:
  schedule:
    - cron: "30 18 * * *"  # Runs daily at 12:00 AM IST (6:30 PM UTC)
  workflow_dispatch:  # Allows manual trigger

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Daily Commit
        run: |
          git config user.name "dipakfirake"
          git config user.email "dcfirake2@gmail.com"
          mkdir -p logs
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Daily update" >> logs/activity.log
          git add logs/activity.log
          git commit -m "chore: daily activity log $(date -u '+%Y-%m-%d')" || echo "No changes"
          git push
